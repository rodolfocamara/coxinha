[package]
name = "session-v3-generator"
version = "0.0.0"
edition = "2021"
[workspace]
[lib]
name = "coxinha_core"
path = "../baseline/source/coxinha-core/src/lib.rs"
[[bin]]
name = "generate"
path = "generate.rs"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
sha2 = "0.10"
hound = "3.5"
[features]
stt-whisper = []
diarization-onnx = []
