[package]
name = "coxinha-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
sha2 = "0.10"
hound = "3.5"
whisper-rs = { version = "0.16", default-features = false, optional = true }
# The default feature enables Metal; spec 0097 P3 runs Tagarela on CPU.
transcribe-cpp = { version = "=0.2.4", default-features = false, optional = true }

pyannote-rs = { version = "0.3.4", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"], optional = true }

[target.'cfg(windows)'.dependencies]
# Spec 0133: WASAPI capture and loopback.
wasapi = "0.18"

[features]
default = []
local-processing = ["stt-whisper", "diarization-onnx"]
diarization-onnx = ["dep:pyannote-rs", "dep:ort"]
stt-whisper = ["dep:whisper-rs"]
stt-tagarela = ["dep:transcribe-cpp"]
# transcribe.cpp as a shared library: its ggml cannot be linked statically
# next to whisper-rs, whose static ggml defines the same symbols.
stt-tagarela-shared = ["stt-tagarela", "transcribe-cpp/shared"]

[dev-dependencies]
tempfile = "3"
