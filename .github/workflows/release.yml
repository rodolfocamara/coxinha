name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - run: pnpm install --frozen-lockfile

      - name: Build installers (models, transcribe.cpp libraries, CPU release)
        run: python scripts/build_release.py --platform windows --features "full-release"

      # A manual run is a check: the installers stay a workflow artifact.
      - name: Upload installers as artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: coxinha-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI + NSIS to a draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Placeholders for macOS and Linux — enable when supported
  build-macos:
    if: false
    runs-on: macos-latest
    steps:
      - run: echo "TODO"

  build-linux:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO"
