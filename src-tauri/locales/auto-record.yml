_version: 2
autoRecord.title:
  en: "Meeting in %{app}"
  pt-BR: "Reunião no %{app}"
autoRecord.started:
  en: "Recording %{title}"
  pt-BR: "Gravando %{title}"
autoRecord.startedBody:
  en: "Started automatically for the %{app} call. Stop it from Coxinha at any time."
  pt-BR: "Começou sozinha pela chamada no %{app}. Dá para parar no Coxinha a qualquer momento."
