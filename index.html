<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/coxinha.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coxinha</title>
    <style>
      /* Keep the native cutouts clear before CSS/React and after theme changes. */
      html[data-native-window='true'],
      html[data-native-window='true'] body,
      html[data-native-window='true'] #root {
        background-color: transparent;
      }
      /* One outer clip includes fixed children and global overlays/portals. */
      html[data-window-rounded='true'] body {
        clip-path: inset(0 round var(--radius-md));
      }
    </style>
    <script>
      // Paint the saved preference before React/CSS loads. Native OS resolution
      // follows asynchronously once the desktop bridge is available.
      (() => {
        let pref;
        try {
          pref = localStorage.getItem('coxinha.themePref');
        } catch {}
        const theme =
          pref === 'light' || pref === 'dark'
            ? pref
            : window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        const root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        if (window.isTauri) {
          root.dataset.nativeWindow = 'true';
          root.style.backgroundColor = 'transparent';
        } else {
          root.style.backgroundColor = theme === 'dark' ? '#242528' : '#f6f5f1';
        }
      })();
    </script>
    <!-- System fonts keep the desktop shell fully offline. -->
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
